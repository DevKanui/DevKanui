# .github/workflows/metrics.yml
#
# Braucht ein Secret METRICS_TOKEN: klassisches PAT (kein fine-grained, das wird
# von der GraphQL-API nicht akzeptiert). Scopes: repo, read:org, read:user.
#
# Rausgeflogen gegenueber deiner alten Config:
#   plugin_projects      -> GitHub hat Projects (classic) abgeschaltet, daher
#                           der rote "Unexpected error" in deiner SVG
#   plugin_achievements  -> wirft bei dir ebenfalls "Unexpected error"
#   plugin_wakatime      -> API error 400, Token abgelaufen. Wenn du es wieder
#                           willst: neues Token auf wakatime.com/settings/api
#                           holen, als Secret WAKATIME_TOKEN, dann den Block
#                           unten einkommentieren
#   plugin_repositories  -> war nie konfiguriert und zeigte nur den Platzhalter
#   plugin_notable       -> "No recent contributions matching filters found"

name: Metrics

on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ------------------------------------------------------------------
      # Hauptkarte
      # ------------------------------------------------------------------
      - name: Main
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: DevKanui

          # config_display: large rendert 900px statt 480px. Sieht deutlich
          # weniger gequetscht aus, sobald mehrere Plugins aktiv sind.
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_animations: yes
          config_padding: 0, 8
          config_octicon: yes

          # Deine alte Config stand auf Asia/Kolkata, was die Streak-Berechnung
          # verfaelscht. Die Zeitzone steht im Footer der SVG, also verraet sie
          # grob deinen Standort. UTC ist der neutrale Kompromiss.
          config_timezone: UTC

          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, scss, shell, dockerfile
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_colors: github

          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15
          plugin_topics_sort: stars

          plugin_stars: yes
          plugin_stars_limit: 2

          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          plugin_discussions: yes
          plugin_discussions_categories: yes

      # ------------------------------------------------------------------
      # Isometrischer Kalender, ganzes Jahr, als eigene SVG
      # ------------------------------------------------------------------
      - name: Isometric calendar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: DevKanui
          base: ""
          config_timezone: UTC
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------
      # AniList als eigene Karte statt angehaengt an die Hauptkarte
      # ------------------------------------------------------------------
      - name: AniList
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.anilist.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          config_animations: yes
          plugin_anilist: yes
          plugin_anilist_user: DEIN_ANILIST_NAME
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 22
          plugin_anilist_shuffle: yes

      # ------------------------------------------------------------------
      # Spotify ueber die Action statt ueber spotify-github-profile.
      # Laeuft im Workflow, nicht auf einer fremden Vercel-Instanz, faellt
      # also nicht einfach aus.
      #
      # Setup: App auf developer.spotify.com anlegen, Client ID + Secret
      # notieren, Refresh Token holen (Anleitung im metrics-Repo unter
      # plugins/music). Dann drei Secrets setzen.
      # ------------------------------------------------------------------
      # - name: Music
      #   if: ${{ success() || failure() }}
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: metrics.music.svg
      #     token: NOT_NEEDED
      #     base: ""
      #     plugin_music: yes
      #     plugin_music_provider: spotify
      #     plugin_music_mode: recent
      #     plugin_music_limit: 4
      #     plugin_music_time_range: short
      #     plugin_music_token: ${{ secrets.SPOTIFY_CLIENT_ID }}, ${{ secrets.SPOTIFY_CLIENT_SECRET }}, ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      # ------------------------------------------------------------------
      # WakaTime, falls du ein frisches Token holst
      # ------------------------------------------------------------------
      # - name: WakaTime
      #   if: ${{ success() || failure() }}
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: metrics.wakatime.svg
      #     token: NOT_NEEDED
      #     base: ""
      #     plugin_wakatime: yes
      #     plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
      #     plugin_wakatime_days: 7
